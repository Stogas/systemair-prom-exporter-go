assert_lefthook_installed: true

pre-commit:
  parallel: true
  commands:
    go-lint:
      run: golangci-lint run
      glob: "**/*.go"

    go-unit-tests:
      run: go test -failfast -short ./...
      glob: "**/*.go"

    go-mod-tidy-check:
      run: go mod tidy -diff
      glob: "{go.mod,go.sum,**/*.go}"

    go-vuln-check:
      run: govulncheck -mode source -test ./...
      glob: "{go.mod,go.sum,**/*.go}"
